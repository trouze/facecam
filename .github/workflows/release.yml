name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s|<string>0.1.0</string>|<string>$VERSION</string>|" Info.plist
          rm Info.plist.bak
          plutil -lint Info.plist

      - name: Build universal app bundle
        run: ./build.sh --release --universal

      - name: Zip app bundle
        run: |
          cd target/universal
          # ditto preserves the bundle layout and metadata correctly for .app
          ditto -c -k --keepParent FaceCam.app FaceCam.app.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/universal/FaceCam.app.zip
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: FaceCam.app.zip
          path: target/universal/FaceCam.app.zip
