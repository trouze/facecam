[package]
name = "facecam"
version = "0.1.0"
edition = "2021"
description = "Tiny macOS app that floats a circular webcam bubble on your screen"

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-av-foundation = { version = "0.3", features = [
    "AVAnimation",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureSession",
    "AVCaptureSessionPreset",
    "AVMediaFormat",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[profile.release]
lto = true
strip = true
